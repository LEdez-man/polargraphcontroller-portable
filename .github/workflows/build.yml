name: Build portable package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$env:GITHUB_RUN_NUMBER" }
          ./scripts/build-package.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polargraph-portable-win64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE-NOTES.md
          files: |
            dist/*.zip
            dist/*.sha256
